[project]
name = "sentinel-pm"
version = "0.2.6"
description = "A lightweight process orchestrator CLI"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["process", "orchestrator", "CLI", "monitoring", "system administration", "development"]
requires-python = ">=3.14"
authors = [{ name = "4ster-light", email = "me@4ster.dev" }]
dependencies = ["psutil>=7.2.2", "rich>=14.1", "typer>=0.21.2"]
classifiers = [
	"Development Status :: 4 - Beta",
	"License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.14",
	"Environment :: Console",
	"Operating System :: POSIX",
	"Operating System :: POSIX :: Linux",
	"Operating System :: MacOS",
	"Topic :: System :: Systems Administration",
	"Topic :: Utilities",
	"Intended Audience :: Developers",
	"Intended Audience :: System Administrators",
]

[project.urls]
Homepage = "https://github.com/4ster-light/sentinel"
Repository = "https://github.com/4ster-light/sentinel"
"Bug Tracker" = "https://github.com/4ster-light/sentinel/issues"
Changelog = "https://github.com/4ster-light/sentinel/releases"

[project.scripts]
sentinel = "sentinel_cli:app"

[dependency-groups]
dev = ["packaging>=26.3", "pytest>=9.2.0", "pytest-cov>=7.1.0", "ruff>=0.17.5", "ty>=0.0.104"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
	"--strict-markers",          # Ensure all markers are registered
	"--strict-config",           # Ensure all config options are valid
	"-ra",                       # Show extra test summary info for skipped, failed, etc.
	"--cov-fail-under=85",       # Minimum coverage percentage
	"--cov=sentinel_core",       # Measure coverage for shared domain logic
	"--cov=sentinel_cli",        # Measure coverage for CLI logic
	"--cov=sentinel_web",        # Measure coverage for the dashboard web layer
	"--cov-report=term-missing", # Show missing lines in terminal report
	"--cov-report=html",         # Generate HTML report for human reading (view in browser)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
skip-excluded-dirs = true

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_core", "src/sentinel_cli", "src/sentinel_web"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E101", "F", "I", "B", "BLE", "C4", "PIE", "PT", "RET", "RUF", "SIM", "T20", "UP"]

[tool.ruff.lint.per-file-ignores]
# Standalone build helper: reporting to the console is its whole interface.
"packaging/check_release.py" = ["T20"]
"packaging/fedora/check_floors.py" = ["T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
