[project]
name = "sentinel-pm"
version = "0.3.3"
description = "A lightweight process orchestrator CLI"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["process", "orchestrator", "CLI", "monitoring", "system administration", "development"]
requires-python = ">=3.14"
authors = [{ name = "4ster-light", email = "me@4ster.dev" }]
dependencies = ["fastapi>=0.115", "jinja2>=3.1", "psutil>=7.2.2", "pyyaml>=6.0.2", "rich>=14.1", "typer>=0.21.2", "uvicorn>=0.32"]
classifiers = [
	"Development Status :: 4 - Beta",
	"License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.14",
	"Environment :: Console",
	"Operating System :: POSIX",
	"Operating System :: POSIX :: Linux",
	"Operating System :: MacOS",
	"Topic :: System :: Systems Administration",
	"Topic :: Utilities",
	"Intended Audience :: Developers",
	"Intended Audience :: System Administrators",
]

[project.urls]
Homepage = "https://github.com/4ster-light/sentinel"
Repository = "https://github.com/4ster-light/sentinel"
"Bug Tracker" = "https://github.com/4ster-light/sentinel/issues"
Changelog = "https://github.com/4ster-light/sentinel/releases"

[project.scripts]
sentinel = "sentinel_cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "packaging>=26.3",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4",
    "pytest-xdist[psutil]>=3.8.0",
    "ruff>=0.17.5",
    "ty>=0.0.104",
    "mutmut==3.8.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
	"-n=logical",                # Use a number of workers equal to the available CPU threads
	"--strict-markers",          # Ensure all markers are registered
	"--strict-config",           # Ensure all config options are valid
	"-ra",                       # Show extra test summary info for skipped, failed, etc.
	"--cov-fail-under=85",       # Minimum coverage percentage
	"--cov=sentinel_core",       # Measure coverage for shared domain logic
	"--cov=sentinel_cli",        # Measure coverage for CLI logic
	"--cov=sentinel_web",        # Measure coverage for the dashboard web layer
	"--cov-report=term-missing", # Show missing lines in terminal report
	"--cov-report=html",         # Generate HTML report for human reading (view in browser)
	"--timeout=60",              # Fail a test that runs longer than a minute
]
filterwarnings = [
	# fastapi's TestClient import warns about the httpx-based starlette shim; httpx2 is not packaged for the nix sandbox yet.
	"ignore:Using `httpx` with `starlette.testclient`:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.mutmut]
# mutmut drives pytest itself, so reset the parallel and coverage addopts for its runs.
source_paths = ["src/"]
# The template tests read golden files; copy them into the work tree.
also_copy = ["tests/cli/golden"]
# The fork runner calls os.wait() in the main process and reaps any child it did
# not fork. A stray child from the clean test run then aborts the run with
# KeyError. The forkserver runner keeps test processes off the main process.
process_isolation = "forkserver"
pytest_add_cli_args = ["-o", "addopts=", "--timeout=15"]
pytest_add_cli_args_test_selection = [
	# The daemon start test pushes the mutants paths and the stats env into its
	# child process, and mutmut's config load then fails from the per-test cwd.
	# Issue #52 removes this deselect.
	# The real-container test needs a live engine. The docker builders are
	# covered by unit tests, and the engine start is slow under mutation runs.
	"--deselect",
	"tests/core/test_docker_integration.py::TestRealContainerLifecycle::test_run_and_stop_a_real_container",
	"--deselect",
	"tests/cli/test_cli_daemon.py::TestDaemonCommands::test_daemon_start_and_stop",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
skip-excluded-dirs = true

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_core", "src/sentinel_cli", "src/sentinel_web"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E101", "F", "I", "B", "BLE", "C4", "PIE", "PT", "RET", "RUF", "SIM", "T20", "UP"]

[tool.ruff.lint.per-file-ignores]
# Standalone build helper: reporting to the console is its whole interface.
"packaging/check_release.py" = ["T20"]
"packaging/fedora/check_floors.py" = ["T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
