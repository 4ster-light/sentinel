version: 2

updates:
  # Runtime dependencies feed the RPM through %pyproject_buildrequires, so they
  # are left ungrouped: every bump needs its own look at the Fedora floors.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: lockfile-only
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    labels: ["dependencies", "python:uv"]
    ignore:
      # fedora-44 ships rich 14.3.2 and typer 0.24; a floor above those breaks the
      # COPR build, so Dependabot does not raise them. Drop these rules once the
      # oldest supported chroot catches up (or at fedora-44 EOL); the lockfile can
      # be refreshed by hand with `uv lock` without touching the floors.
      - dependency-name: rich
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: typer
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      dev:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    labels: ["ci", "dependencies"]
    groups:
      actions:
        update-types: [minor, patch]

  # flake.lock inputs only (nixpkgs, flake-utils), one PR per input, version
  # updates only. A nixpkgs bump changes the dev shell toolchain and the package
  # build inputs, so these are merged by hand through the normal gate.
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build(deps)"
    labels: ["nix", "dependencies"]
