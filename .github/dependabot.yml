version: 2

updates:
  # Runtime dependencies feed the RPM through %pyproject_buildrequires, so they
  # are left ungrouped: every bump needs its own look at the Fedora floors.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: lockfile-only
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    labels: ["dependencies", "python:uv"]
    # Lockfile-only means Dependabot never edits [project.dependencies]: the floors
    # stay at what the Fedora chroots ship, which is what %pyproject_buildrequires
    # reads, while uv.lock tracks newer releases. No per-package ignores needed.
    groups:
      dev:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    labels: ["ci", "dependencies"]
    groups:
      actions:
        update-types: [minor, patch]

  # flake.lock inputs only (nixpkgs, flake-utils), one PR per input, version
  # updates only. A nixpkgs bump changes the dev shell toolchain and the package
  # build inputs, so these are merged by hand through the normal gate.
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build(deps)"
    labels: ["nix", "dependencies"]
