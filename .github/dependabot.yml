version: 2

updates:
  # Runtime dependencies feed the RPM through %pyproject_buildrequires, so they
  # are left ungrouped: every bump needs its own look at the Fedora floors.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    labels: ["dependencies", "python:uv"]
    ignore:
      # fedora-44 ships rich 14.3 and typer 0.24; a floor above those breaks the
      # COPR build, so these bumps wait until the oldest chroot catches up.
      - dependency-name: rich
        update-types: ["version-update:semver-major"]
      - dependency-name: typer
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      dev:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    labels: ["ci", "dependencies"]
    groups:
      actions:
        update-types: [minor, patch]
