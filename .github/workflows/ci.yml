name: CI

# PRs and merge queue entries are the gate. Direct pushes to main do not
# re-run CI, so a validated PR does not duplicate the full check.
on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Nix check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v32.0.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run all checks (tests, lint, format, flake)
        run: nix develop -c just c

      - name: Check Fedora dependency floors
        run: nix develop -c just fedora-floors
