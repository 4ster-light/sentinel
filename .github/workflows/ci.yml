name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Nix check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31.11.5
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run all checks (tests, lint, format, flake)
        run: nix develop -c just c

      - name: Check Fedora dependency floors
        run: nix develop -c just fedora-floors
